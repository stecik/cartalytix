[project]
name = "cartalytix"
version = "1.5.2"
description = "Private receipt collection API"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41",
    "sqlalchemy>=2.0.48",
    "psycopg[binary]>=3.3.3",
    "alembic>=1.18",
    "pydantic-settings>=2.13",
    "argon2-cffi>=25.1",
    "redis>=6,<6.5",
    "celery[redis]>=5.6",
    "babel>=2.18",
    "email-validator>=2.3",
    "httpx>=0.28",
    "cryptography>=46",
    "playwright==1.64.0",
    "mcp>=2.3.0",
    "pdfminer-six>=20260107",
]

[project.scripts]
cartalytix = "cartalytix.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.56"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.15", "ty>=0.0.23", "pytest>=9.0", "httpx2>=2.13.1"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
prerelease = "disallow"

[tool.ty.environment]
root = ["./src", "./tests"]
python = "./.venv"

[project]
name = "cartalytix"
version = "0.1.0"
description = "Experimental, local-only Czech Lidl Plus receipt export"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "keyring>=25,<26", "playwright>=1.55,<2"]

[project.scripts]
cartalytix = "cartalytix.cli:main"
mixit = "mixit.cli:main"
boltfood = "boltfood.cli:main"
wolt = "wolt.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartalytix", "mixit", "boltfood", "wolt"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=work/pytest-temp"

[tool.ruff]
target-version = "py312"


[tool.ty.environment]
root = ["."]
python = "./.venv"

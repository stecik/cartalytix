name: cartalytix

x-backend: &backend
  build: ./backend
  environment: &backend_environment
    CARTALYTIX_ENVIRONMENT: ${CARTALYTIX_ENVIRONMENT:-development}
    CARTALYTIX_DATABASE_URL: postgresql+psycopg://cartalytix:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/cartalytix
    CARTALYTIX_REDIS_URL: redis://redis:6379/0
    CARTALYTIX_ALLOWED_ORIGINS: '${CARTALYTIX_ALLOWED_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://127.0.0.1:5173"]}'
    CARTALYTIX_COOKIE_SECURE: ${CARTALYTIX_COOKIE_SECURE:-false}
    CARTALYTIX_TRUSTED_PROXY_HOSTS: '${CARTALYTIX_TRUSTED_PROXY_HOSTS:-[]}'
    CARTALYTIX_PUBLIC_URL: ${CARTALYTIX_PUBLIC_URL:-}
    CARTALYTIX_TOKEN_KEY_FILE: /run/secrets/lidl_token_key
  secrets:
    - lidl_token_key
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *backend
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend_environment
      CARTALYTIX_BOOTSTRAP_PASSWORD: ${CARTALYTIX_BOOTSTRAP_PASSWORD:-}
    shm_size: 256m
    command: ["uv", "run", "--no-sync", "uvicorn", "cartalytix.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    ports:
      - "127.0.0.1:${API_PORT:-18781}:8000"
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      # Docker Desktop does not reliably forward host file events.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-8080}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    <<: *backend
    command: ["uv", "run", "--no-sync", "celery", "-A", "cartalytix.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--hostname=worker@%h"]
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import os; from cartalytix.tasks import celery_app; replies = celery_app.control.inspect(destination=['worker@' + os.environ.get('HOSTNAME', '')], timeout=5).ping(); raise SystemExit(0 if replies and all(reply.get('ok') == 'pong' for reply in replies.values()) else 1)"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 20s

  beat:
    <<: *backend
    command: ["uv", "run", "--no-sync", "celery", "-A", "cartalytix.tasks:celery_app", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/celerybeat-schedule", "--pidfile=/var/lib/celery/celerybeat.pid"]
    volumes:
      - celery-beat-data:/var/lib/celery
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/var/lib/celery/celerybeat.pid').read_text()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cartalytix
      POSTGRES_USER: cartalytix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartalytix -d cartalytix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  celery-beat-data:

secrets:
  lidl_token_key:
    file: ${TOKEN_KEY_PATH:-./.secrets/lidl.key}
